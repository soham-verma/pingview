name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev pkg-config

      - name: Fetch built-in map (pinned OpenStreetMap extract, ~189 MB)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) asset=go-pmtiles-1.31.2_Darwin_arm64.zip ;;
            Windows) asset=go-pmtiles_1.31.2_Windows_x86_64.zip ;;
            *) asset=go-pmtiles_1.31.2_Linux_x86_64.tar.gz ;;
          esac
          mkdir -p "$RUNNER_TEMP/pmtiles" && cd "$RUNNER_TEMP/pmtiles"
          curl -sSL -o "$asset" "https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/$asset"
          case "$asset" in *.zip) unzip -oq "$asset" ;; *) tar xzf "$asset" ;; esac
          cd "$GITHUB_WORKSPACE"
          PMTILES="$RUNNER_TEMP/pmtiles/pmtiles" scripts/fetch_basemap.sh

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The OS location code lives in its own crate (one backend per OS).
      - name: Clippy (locate)
        working-directory: src-tauri/locate
        run: cargo clippy -- -D warnings
