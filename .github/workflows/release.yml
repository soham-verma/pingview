name: Release

# Push a tag like v0.2.0 and this builds PingView for every platform and
# publishes a GitHub Release with the installers attached (same flow as
# Pingnet).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.os }}
    env:
      # Secrets can't be read in step `if:` conditions; expose whether the
      # notarization key exists so unsigned builds still work without it.
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_CONTENT != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev libdbus-1-dev pkg-config

      - name: Fetch built-in map (pinned OpenStreetMap extract, ~189 MB)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) asset=go-pmtiles-1.31.2_Darwin_arm64.zip ;;
            Windows) asset=go-pmtiles_1.31.2_Windows_x86_64.zip ;;
            *) asset=go-pmtiles_1.31.2_Linux_x86_64.tar.gz ;;
          esac
          mkdir -p "$RUNNER_TEMP/pmtiles" && cd "$RUNNER_TEMP/pmtiles"
          curl -sSL -o "$asset" "https://github.com/protomaps/go-pmtiles/releases/download/v1.31.2/$asset"
          case "$asset" in *.zip) unzip -oq "$asset" ;; *) tar xzf "$asset" ;; esac
          cd "$GITHUB_WORKSPACE"
          PMTILES="$RUNNER_TEMP/pmtiles/pmtiles" scripts/fetch_basemap.sh

      - run: npm ci

      - name: Write Apple API key (notarization)
        if: startsWith(matrix.os, 'macos') && env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_CONTENT" | base64 --decode > "$RUNNER_TEMP/private_keys/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/private_keys/apple_api_key.p8" >> "$GITHUB_ENV"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code signing (Developer ID Application certificate) and
          # notarization (App Store Connect API key). Ignored on Linux and
          # Windows runners; without them macOS builds are unsigned.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PingView ${{ github.ref_name }}'
          releaseBody: |
            Download the installer for your computer below, plug in the PingView receiver and open the app.
            - macOS: `aarch64.dmg` for Apple silicon (M1 and newer), `x64.dmg` for Intel Macs
            - Windows: `.msi` or `-setup.exe`
            - Linux: `.deb` (Debian/Ubuntu) or `.AppImage`
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
